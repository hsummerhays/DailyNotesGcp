# Production profile: no fallback defaults. Every value here must be supplied
# via environment variable (e.g. injected from GCP Secret Manager / K8s secrets)
# or Spring Boot fails to start. Activate with SPRING_PROFILES_ACTIVE=prod.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false

spring.data.mongodb.uri=${MONGODB_URI}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.jwt.cookie-secure=true
app.jwt.cookie-same-site=${COOKIE_SAME_SITE:Lax}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
