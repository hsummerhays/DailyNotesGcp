spring.application.name=cloud-notes
spring.datasource.url=jdbc:postgresql://localhost:5433/cloudnotes
spring.datasource.username=cloudnotes_user
spring.datasource.password=cloudnotes_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# MongoDB Configuration (Local Dev / Docker container)
spring.data.mongodb.uri=mongodb://localhost:27017/cloudnotes
# For GCP Production, you will use MongoDB Atlas Connection URI injected via Secret Manager
# e.g., spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

