global:
  projectId: "daily-notes-gcp"
  region: "us-central1"
  environment: "dev"

backend:
  replicaCount: 2
  image:
    repository: "us-central1-docker.pkg.dev/daily-notes-gcp/cloudnotes/backend"
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  jvmOptions: "-XX:MaxRAMPercentage=75 -XX:+UseG1GC"
  sqlProxy:
    version: "2.11.2"
    port: 5432
  secrets:
    # Actual secret values - override via --set at deploy time, never commit real values
    dbPassword: "placeholder-db-password-change-me"
    mongodbUri: "mongodb://mongodb:27017/cloudnotes"
    jwtSecret: "placeholder-jwt-signing-secret-change-me-32bytes-long"

importWorker:
  replicaCount: 1
  image:
    repository: "us-central1-docker.pkg.dev/daily-notes-gcp/cloudnotes/import-worker"
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  jvmOptions: "-XX:MaxRAMPercentage=75 -XX:+UseG1GC"


frontend:
  replicaCount: 1
  image:
    repository: "us-central1-docker.pkg.dev/daily-notes-gcp/cloudnotes/frontend"
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

gateway:
  # The external static IP name in GCP to bind to the Gateway load balancer (if any)
  staticIpName: ""
