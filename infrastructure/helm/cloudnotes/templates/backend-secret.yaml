{{/*
  Secret values come from .Values.backend.secrets, injected via --set at
  deploy time from CI/CD secrets (see .github/workflows/deploy.yml).
  Never commit real values here - values.yaml only holds placeholders.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: cloudnotes-backend-secret-sync
  namespace: {{ .Release.Namespace | default "default" }}
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | default "default" }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.backend.secrets.dbPassword | quote }}
  MONGODB_URI: {{ .Values.backend.secrets.mongodbUri | quote }}
  JWT_SECRET: {{ .Values.backend.secrets.jwtSecret | quote }}
