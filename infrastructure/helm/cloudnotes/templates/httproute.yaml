apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cloudnotes-route
  namespace: {{ .Release.Namespace | default "default" }}
spec:
  parentRefs:
    - name: cloudnotes-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: cloudnotes-backend
          port: 8080
    - backendRefs:
        - name: cloudnotes-frontend
          port: 80
