apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudnotes-worker
  namespace: {{ .Release.Namespace | default "default" }}
  labels:
    app: cloudnotes-worker
spec:
  replicas: {{ .Values.importWorker.replicaCount }}
  selector:
    matchLabels:
      app: cloudnotes-worker
  template:
    metadata:
      labels:
        app: cloudnotes-worker
    spec:
      serviceAccountName: cloudnotes-backend # Reuses same service account with Workload Identity permissions
      containers:
        - name: worker
          image: "{{ .Values.importWorker.image.repository }}:{{ .Values.importWorker.image.tag }}"
          imagePullPolicy: {{ .Values.importWorker.image.pullPolicy }}
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: DB_URL
              value: jdbc:postgresql://127.0.0.1:5432/cloudnotes
            - name: DB_USER
              value: cloudnotes_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudnotes-backend-secret-sync
                  key: DB_PASSWORD
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: cloudnotes-backend-secret-sync
                  key: MONGODB_URI
            - name: JAVA_TOOL_OPTIONS
              value: "{{ .Values.importWorker.jvmOptions }}"
            # In GKE, we don't configure emulator host; standard GCP SDK finds the GCP Pub/Sub endpoints automatically.
            - name: GCP_PROJECT_ID
              value: "{{ .Values.global.projectId }}"
          resources:
            {{- toYaml .Values.importWorker.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          volumeMounts:
            - name: secrets-mount
              mountPath: "/mnt/secrets"
              readOnly: true

        - name: cloud-sql-proxy
          image: "gcr.io/cloud-sql-connectors/cloud-sql-proxy:{{ .Values.backend.sqlProxy.version }}"
          args:
            - "--structured-logs"
            - "--auto-iam-authn"
            - "--port={{ .Values.backend.sqlProxy.port }}"
            - "{{ .Values.global.projectId }}:{{ .Values.global.region }}:cloudnotes-db-{{ .Values.global.environment }}"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

      volumes:
        - name: secrets-mount
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "cloudnotes-secrets-provider"
