server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # The app shell must always be revalidated so a deploy isn't hidden behind a stale cache.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite emits content-hashed filenames, so these are safe to cache indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Reverse-proxy to the backend over the compose network so the browser only ever
    # talks to one origin - no CORS needed for the containerized stack, and the port
    # docker-compose happens to publish the backend on becomes an implementation detail.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }

    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
