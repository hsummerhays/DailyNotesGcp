services:
  postgres:
    image: postgres:16-alpine
    container_name: cloud-notes-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: cloudnotes
      POSTGRES_USER: ${DB_USER:-cloudnotes_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cloudnotes_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudnotes_user -d cloudnotes"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: cloud-notes-nosql
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: cloudnotes
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: cloud-notes-pubsub
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8089
    ports:
      - "8089:8089"
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s = socket.socket(); s.connect(('127.0.0.1', 8089))"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: services/notes-api/Dockerfile
    container_name: cloud-notes-backend
    ports:
      - "8085:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/cloudnotes
      - DB_USER=${DB_USER:-cloudnotes_user}
      - DB_PASSWORD=${DB_PASSWORD:-cloudnotes_password}
      - MONGODB_URI=mongodb://mongodb:27017/cloudnotes
      - JWT_SECRET=${JWT_SECRET:-dGhpcy1pcy1hLXZlcnktc2VjdXJlLTMyLWJ5dGUtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQ=}
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8086,http://127.0.0.1:8086
      - COOKIE_SECURE=false
      - PUBSUB_EMULATOR_HOST=pubsub:8089
      - GCP_PROJECT_ID=cloudnotes-dev
      - SPRING_PROFILES_ACTIVE=local
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      pubsub:
        condition: service_healthy

  import-worker:
    build:
      context: .
      dockerfile: services/import-worker/Dockerfile
    container_name: cloud-notes-worker
    ports:
      - "8087:8081"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/cloudnotes
      - DB_USER=${DB_USER:-cloudnotes_user}
      - DB_PASSWORD=${DB_PASSWORD:-cloudnotes_password}
      - MONGODB_URI=mongodb://mongodb:27017/cloudnotes
      - PUBSUB_EMULATOR_HOST=pubsub:8089
      - GCP_PROJECT_ID=cloudnotes-dev
      - SPRING_PROFILES_ACTIVE=local
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      pubsub:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloud-notes-frontend
    ports:
      - "8086:8080"
    depends_on:
      - backend

volumes:
  pgdata:
  mongodata:
