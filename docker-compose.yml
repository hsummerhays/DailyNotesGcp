version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cloud-notes-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: cloudnotes
      POSTGRES_USER: cloudnotes_user
      POSTGRES_PASSWORD: cloudnotes_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudnotes_user -d cloudnotes"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: cloud-notes-nosql
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: cloudnotes
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloud-notes-backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/cloudnotes
      - DB_USER=cloudnotes_user
      - DB_PASSWORD=cloudnotes_password
      - MONGODB_URI=mongodb://mongodb:27017/cloudnotes
      - JWT_SECRET=dGhpcy1pcy1hLXZlcnktc2VjdXJlLTMyLWJ5dGUtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQ=
      - CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:5173
      - COOKIE_SECURE=false
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloud-notes-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  mongodata:
