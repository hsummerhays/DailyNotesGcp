spring.application.name=import-worker
server.port=8081

# PostgreSQL configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/cloudnotes}
spring.datasource.username=${DB_USER:cloudnotes_user}
spring.datasource.password=${DB_PASSWORD:cloudnotes_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/cloudnotes}

# Google Cloud GCP Pub/Sub config (uses local emulator by default in dev)
spring.cloud.gcp.pubsub.emulator-host=${PUBSUB_EMULATOR_HOST:localhost:8089}
spring.cloud.gcp.project-id=${GCP_PROJECT_ID:cloudnotes-dev}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Graceful Shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
