spring.application.name=cloud-notes

# Local dev defaults below are overridable via env vars so the same file works
# unmodified against docker-compose. Real deployments should activate the
# "prod" profile (application-prod.properties), which has no defaults and
# will fail fast if secrets aren't injected via Secret Manager / env vars.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/cloudnotes}
spring.datasource.username=${DB_USER:cloudnotes_user}
spring.datasource.password=${DB_PASSWORD:cloudnotes_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:true}

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Graceful Shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Trust X-Forwarded-* headers from the nginx proxy in front of this service so scheme/
# client-IP are read correctly instead of always seeing the proxy's own connection.
server.forward-headers-strategy=framework

# MongoDB Configuration (Local Dev / Docker container)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/cloudnotes}

# JWT (dev-only default secret below - never rely on this default outside local dev)
jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLTMyLWJ5dGUtc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQ=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Auth cookie
app.jwt.cookie-secure=${COOKIE_SECURE:false}
app.jwt.cookie-same-site=${COOKIE_SAME_SITE:Lax}

# CORS - comma-separated list of allowed origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Google Cloud GCP Pub/Sub config
spring.cloud.gcp.project-id=${GCP_PROJECT_ID:cloudnotes-dev}

# Google OAuth2 Client Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:placeholder-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:placeholder-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:5173/dashboard}

