spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

# Bypass Google Cloud credentials verification for unit/integration tests
spring.cloud.gcp.credentials.enabled=false
spring.cloud.gcp.pubsub.emulator-host=localhost:8089

# Test rate limiter configuration (fast testing)
app.rate-limit.capacity=5
app.rate-limit.refill-rate-per-second=1.0


