name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER_NAME }}
  GKE_ZONE: ${{ secrets.GCP_REGION || 'us-central1' }}
  REGISTRY: us-central1-docker.pkg.dev
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build and Test Java Services
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend React App
        run: |
          cd frontend
          npm ci
          npm run build

  deploy-to-gke:
    name: Deploy to Google Kubernetes Engine
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build & Push notes-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/notes-api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/cloudnotes/backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/cloudnotes/backend:latest

      - name: Build & Push import-worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/import-worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/cloudnotes/import-worker:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/cloudnotes/import-worker:latest

      - name: Build & Push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/cloudnotes/frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/cloudnotes/frontend:latest

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.12.0'

      - name: Deploy with Helm
        run: |
          helm upgrade --install cloudnotes ./infrastructure/helm/cloudnotes \
            --namespace default \
            --set global.projectId=${{ env.PROJECT_ID }} \
            --set global.region=${{ env.GKE_ZONE }} \
            --set backend.image.repository=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/cloudnotes/backend \
            --set backend.image.tag=${{ github.sha }} \
            --set importWorker.image.repository=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/cloudnotes/import-worker \
            --set importWorker.image.tag=${{ github.sha }} \
            --set frontend.image.repository=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/cloudnotes/frontend \
            --set frontend.image.tag=${{ github.sha }} \
            --set backend.secrets.dbPassword=${{ secrets.DB_PASSWORD }} \
            --set backend.secrets.mongodbUri=${{ secrets.MONGODB_URI }} \
            --set backend.secrets.jwtSecret=${{ secrets.JWT_SECRET }}
